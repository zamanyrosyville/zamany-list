<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة طلبات العملاء</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap');
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#edeee9;--card:#fbfbf8;--inp:#fff;--tx:#241b16;--mut:#6f6459;--bd:#d9d8cf;
 --pri:#5a3a2a;--acc:#b57a2c;--ok:#2f7d5b;--bad:#b8412f;--hd:#2a1d17;--hdtx:#f1e6d6;--hdmut:#bfa98f;
 --f:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;--fd:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16110e;--card:#211a16;--inp:#2a211c;--tx:#efe6da;--mut:#a89886;--bd:#3a2e27;--pri:#c9a27a;--hd:#0e0a08}}
:root[data-theme="dark"]{--bg:#16110e;--card:#211a16;--inp:#2a211c;--tx:#efe6da;--mut:#a89886;--bd:#3a2e27;--pri:#c9a27a;--hd:#0e0a08}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:15px;line-height:1.6}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{background:var(--hd);color:var(--hdtx);padding:12px 16px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid var(--acc)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{margin:0;font-family:var(--fd);font-weight:700;font-size:21px;letter-spacing:0;color:var(--hdtx)}
h1 small{font-family:var(--f);font-weight:400;font-size:13px;color:var(--hdmut);margin-right:8px}
.acts{display:flex;gap:6px}
header input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:var(--hdtx)}
header input::placeholder{color:var(--hdmut)}
header button.b.s{background:rgba(255,255,255,.08);color:var(--hdtx);border:1px solid rgba(255,255,255,.22)}
nav{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;padding:11px 16px;border:0;border-bottom:3px solid transparent;margin-bottom:-3px;background:transparent;color:var(--hdmut);border-radius:0;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:var(--acc);background:rgba(255,255,255,.07)}
main{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.card>b:first-child{font-family:var(--fd);font-size:17px;font-weight:700;color:var(--pri)}
summary{cursor:pointer;font-weight:600;list-style:none}summary::-webkit-details-marker{display:none}details>summary::before{content:"◂ ";color:var(--pri)}details[open]>summary::before{content:"▾ "}
.sec{padding:0}.sec>summary{padding:12px 14px;font-size:16px}.sec>.secbody{padding:0 12px 12px}.sec .card{box-shadow:none}.secnav{position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:6px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--inp);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}.row .x{flex:0 0 auto;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.g2{grid-template-columns:1fr}}
button.b{padding:10px 16px;border:0;border-radius:8px;background:var(--pri);color:#fff;font:inherit;font-weight:500;cursor:pointer}
button.b:active{transform:translateY(1px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.b{color:#1a120d}}
button.b.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.b.ok{background:var(--ok);color:#fff}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500;color:#fff;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;text-align:center}
.kpi b{display:block;font-family:var(--fd);font-size:28px;color:var(--pri)}.kpi span{font-size:12px;color:var(--mut)}
.kpi.on{outline:2px solid var(--acc);border-color:var(--acc)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;background:rgba(0,0,0,.025)}
.mut{color:var(--mut);font-size:12px}
.hold{color:var(--bad);font-size:13px}
.log{font-size:13px;line-height:1.9;border-top:1px dashed var(--bd);padding-top:6px}
.empty{text-align:center;color:var(--mut);padding:30px}
.mod{background:#7b5aa6;color:#fff;border-radius:10px;padding:1px 8px;font-size:12px}
/* شاشة الدخول */
.login{max-width:760px;margin:0 auto}
.hero{position:relative;overflow:hidden;background:var(--hd);color:var(--hdtx);border-radius:16px;padding:34px 24px 28px;margin-bottom:14px;min-height:190px}
.hero h2{margin:0 0 6px;font-family:var(--fd);font-size:30px;font-weight:700;line-height:1.3}
.hero p{margin:0;color:var(--hdmut);max-width:30ch}
.hero svg{position:absolute;left:18px;bottom:0;width:120px;height:100%;pointer-events:none}
.hero svg path{fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;opacity:.75;stroke-dasharray:300;stroke-dashoffset:300;animation:rise 3.2s ease-out .2s forwards}
.hero svg path+path{stroke:var(--hdmut);opacity:.4;animation-delay:.7s}
@keyframes rise{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.hero svg path{animation:none;stroke-dashoffset:0}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.tiles{grid-template-columns:1fr}.hero h2{font-size:25px}}
.tile{margin:0}
.tile h3{margin:0 0 2px;font-family:var(--fd);font-size:17px;color:var(--pri)}
.tile p{margin:0 0 10px;color:var(--mut);font-size:13px}
.craw{font-weight:700;font-size:16px;color:#8a5410}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .craw{color:#e0a85a}}
.hero p{max-width:22ch}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills .b{padding:12px 18px;font-size:16px}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#000;background:#fff;font-size:12px;direction:rtl}
  #printArea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea table{width:100%;border-collapse:collapse;margin:4px 0}
  #printArea th,#printArea td{border:1px solid #444;padding:4px 6px;color:#000;font-size:12px}
  #printArea h2{margin:0 0 4px}
  #printArea .pb{page-break-inside:avoid;margin-bottom:12px}
  @page{size:A4;margin:10mm}
  body{background:#fff!important}
  #printArea{box-sizing:border-box;width:100%;padding:0 1mm}
  #printArea,#printArea *{box-sizing:border-box}
  #printArea table{table-layout:auto}
  #printArea th,#printArea td{overflow-wrap:anywhere;word-break:break-word}
  #printArea .pb{border:0}
  #printArea .wbx{width:100%;height:131mm;border:2px solid #000;padding:0;overflow:hidden;font-size:15px;page-break-inside:avoid}
  #printArea .wbcut{border-top:2px dashed #666;margin:2.5mm 0;height:0;text-align:center}
  #printArea .wbx .co{background:#000;color:#fff;text-align:center;font-size:38px;font-weight:700;padding:10px 8px;line-height:1.2}
  #printArea .wbx table{margin:0}
  #printArea .wbx th{width:26%;background:#eee;font-size:15px}
  #printArea .wbx td{font-size:18px;font-weight:600;padding:5px 8px}
}
#msg{background:#fff3cd;color:#664d03;padding:8px 14px;font-size:13px;display:none}

/* ===== تصميم ERP – طبقة الشكل فقط ===== */
:root{--bg:#f2f0ea;--card:#fff;--bd:#e3dfd5;--rad:14px;--sh:0 1px 2px rgba(42,29,23,.06),0 4px 14px rgba(42,29,23,.05);--sb:250px;--sbbg:#2a1d17;--sbtx:#f1e6d6;--sbmut:#b9a58c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#130f0c;--card:#1d1613;--bd:#33281f;--sh:0 1px 2px rgba(0,0,0,.4);--sbbg:#0c0907}}
:root[data-theme="dark"]{--bg:#130f0c;--card:#1d1613;--bd:#33281f;--sh:0 1px 2px rgba(0,0,0,.4);--sbbg:#0c0907}
body{background:var(--bg)}
.card{border-radius:var(--rad);box-shadow:var(--sh);border-color:var(--bd)}
.card>b:first-child{display:inline-block;margin-bottom:2px}
input,select,textarea{border-radius:10px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(181,122,44,.18)}
button.b{border-radius:10px;padding:10px 16px;transition:filter .15s,transform .05s;box-shadow:0 1px 1px rgba(0,0,0,.08)}
button.b:hover{filter:brightness(1.08)}
button.b.s{box-shadow:none;background:var(--card)}
button.b.s:hover{background:rgba(181,122,44,.1);filter:none}
/* جداول */
.tw{border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{font-size:14px}
th{position:sticky;top:0;background:rgba(90,58,42,.07);color:var(--pri);font-size:12px;letter-spacing:.2px;white-space:nowrap}
td{border-bottom:1px solid var(--bd)}
tbody tr:nth-child(even) td,table tr:nth-child(even) td{background:rgba(90,58,42,.025)}
table tr:hover td{background:rgba(181,122,44,.08)}
.tag{padding:3px 11px;font-weight:600}
/* بطاقات المؤشرات */
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{position:relative;text-align:right;border-radius:var(--rad);box-shadow:var(--sh);padding:14px 14px 12px;border-top:4px solid var(--kc,var(--bd));transition:transform .12s,box-shadow .12s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(42,29,23,.12)}
.kpi b{font-size:32px;line-height:1.1;color:var(--kc,var(--pri))}
.kpi span{display:block;margin-top:4px;font-size:12.5px;font-weight:500}
.pipe{display:flex;height:12px;border-radius:8px;overflow:hidden;margin:2px 0 12px;background:var(--bd)}
.pipe i{display:block;cursor:pointer;min-width:3px}
.pipeleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px;font-size:12px;color:var(--mut)}
.pipeleg span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-left:5px}
/* القائمة الجانبية (كمبيوتر) */
header{border-bottom:0}
nav button:before{display:block;font-size:17px;line-height:1}
nav button[data-v=tele]:before{content:"📞"}nav button[data-v=log]:before{content:"🧭"}nav button[data-v=wm]:before{content:"🏬"}
nav button[data-v=wo]:before{content:"🏭"}nav button[data-v=wa]:before{content:"🏪"}nav button[data-v=acc]:before{content:"💳"}
nav button[data-v=dash]:before{content:"🏛"}nav button[data-v=rep]:before{content:"📊"}
#topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);position:sticky;top:0;z-index:4;max-width:1180px;margin:0 auto}
#topbar h2{margin:0;font-family:var(--fd);font-size:20px;color:var(--pri);white-space:nowrap}
#tbq{flex:1;min-width:0;background:var(--card);padding:9px 12px}
.tbb{position:relative;flex:0 0 auto;width:42px;height:42px;padding:0!important;display:grid;place-items:center;font-size:18px;background:var(--card)!important}
.tbb em{position:absolute;top:-5px;left:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font:700 11px/19px var(--f);text-align:center;font-style:normal;padding:0 4px}
body.nol #topbar{display:none}
@media(min-width:900px){
  header{position:fixed;top:0;right:0;bottom:0;width:var(--sb);display:flex;flex-direction:column;padding:20px 12px 14px;background:var(--sbbg);color:var(--sbtx);overflow-y:auto;z-index:7;border-left:1px solid rgba(255,255,255,.06)}
  .top{display:contents}
  header h1{order:0;font-size:24px;padding:4px 8px 14px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
  header h1 small{display:block;margin:2px 0 0;font-size:12px}
  header>div:not(.top){order:2;margin:12px 0 0!important}
  nav{order:1;flex-direction:column;gap:3px;margin:0;padding:0;overflow:visible}
  nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:0;margin:0;border-radius:10px;padding:11px 12px;color:var(--sbmut);font-size:15px}
  nav button:hover{background:rgba(255,255,255,.07);color:#fff}
  nav button.on{background:linear-gradient(90deg,rgba(181,122,44,.35),rgba(181,122,44,.12));color:#fff;box-shadow:inset -3px 0 0 var(--acc)}
  .acts{order:3;margin-top:auto;flex-direction:column;padding-top:14px}
  .acts .b{width:100%;text-align:right}
  body:not(.nol) main,body:not(.nol) #topbar,body:not(.nol) #msg{margin-right:var(--sb)}
  body:not(.nol) #topbar{max-width:none;padding:12px 22px;background:var(--bg)}
  body:not(.nol) main{max-width:none;padding:6px 22px 40px}
  body:not(.nol) main>*{max-width:1180px}
  body:not(.nol) #notify,body:not(.nol) #toast{right:calc(var(--sb) + 12px)!important}
  body.nol header{position:static;width:auto;flex-direction:row;flex-wrap:wrap;padding:12px 16px}
  body.nol .top{display:flex;width:100%}
  body.nol header h1{border:0;padding:0;margin:0}body.nol header h1 small{display:inline}
  body.nol .acts{flex-direction:row;margin:0;padding:0}body.nol .acts .b{width:auto}
}
/* موبايل: شريط علوي صغير + تبويب سفلي */
@media(max-width:899px){
  header{padding:10px 12px 8px;border-bottom:3px solid var(--acc);background:var(--sbbg)}
  .top{margin-bottom:6px;flex-wrap:nowrap}
  h1{font-size:19px}h1 small{display:none}
  .acts{overflow-x:auto;scrollbar-width:none;max-width:70%}.acts .b{white-space:nowrap;padding:7px 10px;font-size:13px}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:8;margin:0;padding:0 4px env(safe-area-inset-bottom,0px);background:var(--sbbg);border-top:1px solid rgba(255,255,255,.12);justify-content:flex-start}
  nav button{flex:1 0 auto;min-width:68px;padding:8px 8px 7px;border:0;margin:0;font-size:11.5px;text-align:center;border-top:3px solid transparent;border-radius:0}
  nav button.on{border-top-color:var(--acc);background:rgba(255,255,255,.08)}
  main{padding-bottom:96px}
  #topbar{position:static;padding:10px 12px 0}#topbar h2{font-size:17px}
  #tbq{font-size:14px}
  #notify,#toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))!important}
  body.nol nav{display:none}body.nol main{padding-bottom:40px}
  .tw{margin:0 -4px}
}

.prbox{margin:8px 0;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:rgba(90,58,42,.04)}.prbox.need{border-color:var(--bad);background:rgba(184,65,47,.08)}.prbox label{margin:0 0 4px}
.tag.prio{font-weight:700;margin-left:4px}
/* ===== هوية كل قسم ===== */
body[data-v=tele]{--dep:#b5560f}body[data-v=log]{--dep:#3d6f8e}body[data-v=wm]{--dep:#6b4430}body[data-v=wo]{--dep:#2a7f7f}
body[data-v=wa]{--dep:#7a8a2e}body[data-v=acc]{--dep:#2f7d5b}body[data-v=dash]{--dep:#7b5aa6}body[data-v=rep]{--dep:#4a5a70}
#topbar h2{color:var(--dep,var(--pri))}
nav button.on{box-shadow:inset -3px 0 0 var(--dep,var(--acc))}
@media(max-width:899px){nav button.on{border-top-color:var(--dep,var(--acc))}}
.dep{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-right:6px solid var(--dep,var(--acc));border-radius:var(--rad);box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px}
.dep .di{font-size:30px;line-height:1;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--dep,var(--acc)) 14%,transparent)}
.dep .dt{flex:1;min-width:180px}.dep h3{margin:0;font-family:var(--fd);font-size:19px;color:var(--dep,var(--pri))}.dep p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.dep .dc{display:flex;gap:8px;flex-wrap:wrap}.dep .dc div{min-width:78px;text-align:center;padding:6px 12px;border-radius:12px;background:color-mix(in srgb,var(--dep,var(--acc)) 9%,transparent)}
.dep .dc b{display:block;font-family:var(--fd);font-size:22px;line-height:1.1;color:var(--dep,var(--pri))}.dep .dc span{font-size:11.5px;color:var(--mut)}
.dep .dc .bad b{color:var(--bad)}
.card>b:first-child,.tile h3{color:var(--dep,var(--pri))}
.card details>summary b{color:var(--tx)}
.tile{border-top:4px solid var(--acc);transition:transform .12s}.tile:hover{transform:translateY(-2px)}
.tile:nth-child(1){border-top-color:#3d6f8e}.tile:nth-child(2){border-top-color:#2f7d5b}.tile:nth-child(3){border-top-color:#6b4430}.tile:nth-child(4){border-top-color:#2a7f7f}.tile:nth-child(5){border-top-color:#7a8a2e}
.card tr td .wi,.card .wi{border-radius:8px}

/* ===== توحيد الشكل (أسلوب Odoo: بسيط، مسطّح، خط واحد، أحجام موحدة) ===== */
:root{--fd:var(--f);--fs:14px;--fs-s:12.5px;--fs-h1:21px;--fs-h2:17px;--fs-h3:15px;--r:6px;--rad:10px;--ctl:38px;--sh:0 1px 2px rgba(42,29,23,.05)}
body{font-size:var(--fs);line-height:1.6;font-weight:400}
h1,h2,h3,.card>b:first-child,.kpi b,.dep h3,.tile h3,#topbar h2,.hero h2{font-family:var(--f)!important}
h1{font-size:var(--fs-h1);font-weight:700}
#topbar h2,.dep h3{font-size:var(--fs-h1);font-weight:700}
.card>b:first-child,.tile h3,summary b,.sec>summary{font-size:var(--fs-h2);font-weight:600}
label{font-size:var(--fs-s);font-weight:500;color:var(--mut)}
.mut,.hold,.log{font-size:var(--fs-s)}
.card{border-radius:var(--rad);box-shadow:var(--sh)}
/* حقول موحدة */
input,select,textarea{min-height:var(--ctl);border-radius:var(--r);font-size:var(--fs);padding:7px 10px;border:1px solid var(--bd);background:var(--inp)}
textarea{min-height:90px;line-height:1.7}
input[type=checkbox],input[type=radio]{min-height:0;accent-color:var(--pri)}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 2px rgba(90,58,42,.15)}
/* أزرار موحدة: رئيسي ممتلئ، ثانوي بإطار، خطر/نجاح بلون الحالة */
button.b{min-height:var(--ctl);border-radius:var(--r);font-size:var(--fs);font-weight:600;padding:7px 16px;box-shadow:none;background:var(--pri);color:#fff;border:1px solid var(--pri)}
button.b:hover{filter:none;background:color-mix(in srgb,var(--pri) 88%,#000)}
button.b.s{background:var(--card);color:var(--pri);border:1px solid var(--bd);font-weight:500}
button.b.s:hover{background:color-mix(in srgb,var(--pri) 8%,var(--card))}
button.b.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.b.x{min-height:34px;padding:5px 12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.b:not(.s){color:#1a120d}}
/* جداول موحدة */
.tw{border-radius:var(--r)}
table{font-size:var(--fs)}
th{font-size:var(--fs-s);font-weight:600;background:rgba(90,58,42,.06);color:var(--tx);border-bottom:2px solid var(--bd);padding:9px 10px}

/* ---- مهلة خروج البضاعة + بيانات الشحن + الطباعة ---- */
let logHours=72,accHours=24,shipHours=72,shipHoursBy={},whHours={},editShip=null;
const SHIPM=["شركة شحن","تسليم الشركة"],HR=3600000;
const fmtDur=ms=>{ms=Math.abs(ms);const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/HR),m=Math.floor(ms%HR/6e4);return ((d?d+" يوم ":"")+(h?h+" ساعة ":"")+(!d?m+" دقيقة":"")).trim()};
function workDue(st,h){let t=st,rem=h*HR,g=0;while(rem>0&&g++<5000){const d=new Date(t),nm=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();if(d.getDay()===5){t=nm;continue}const ch=Math.min(rem,nm-t);t+=ch;rem-=ch}return t}
const hoursOf=o=>+shipHoursBy[o.shipMethod]>0?+shipHoursBy[o.shipMethod]:shipHours;
const dueAt=o=>o.accAt?workDue(o.accAt,hoursOf(o)):0;
const isDone=o=>["shipped","delivered"].includes(o.stage);
function dueInfo(o){
  if(o.stage==="cancelled")return null;
  if(!o.accAt)return {c:"wait",t:"مهلة الخروج ("+hoursOf(o)+" ساعة) لسه ما بدأتش – بانتظار تأكيد الحسابات للتحصيل"};
  const due=dueAt(o);
  if(isDone(o)){const at=o.shippedAt||0;if(!at)return {c:"ok",t:"خرجت البضاعة"};return at<=due?{c:"ok",t:"خرجت في الوقت ✓"}:{c:"late",t:"خرجت متأخرة "+fmtDur(at-due)}}
  const left=due-Date.now();
  if(left<=0)return {c:"late",t:"متأخر "+fmtDur(left)+" عن موعد خروج البضاعة",late:true};
  return {c:left<12*HR?"warn":"ok",t:"باقي "+fmtDur(left)+" على خروج البضاعة (آخر موعد "+fmt(due)+")"};

function parseItems(txt,opt){

  const fmt=(withO?"رقم الطلب | ":"")+PASTE_FMT;

  const cellsOf=l=>{let c=l.indexOf("\t")>=0?l.split("\t"):/[,;،]/.test(l)?l.split(/[,;،]/):l.split(/\s{2,}/);c=c.map(x=>x.trim());while(c.length&&c[c.length-1]==="")c.pop();return c};

    if(h.length&&/كود|code|sku|طلب|order/i.test(h.join(" "))&&!h.some(x=>isNum(x)&&x!=="")){
      const want=withO?["طلب","كود","صنف|اسم","وحد","كمي"]:["كود","صنف|اسم","وحد","كمي"];
      const ok=h.length===N&&want.every((w,i)=>new RegExp(w,"i").test(h[i]));

    const n=ix+1+start,c=cellsOf(line),tag="سطر "+n+": ";
    if(c.length<N){bad.push(tag+"بيانات ناقصة ("+c.length+" أعمدة من "+N+") – الترتيب: "+fmt);return}
    if(c.length>N){bad.push(tag+"أعمدة زيادة ("+c.length+" بدل "+N+") – الترتيب: "+fmt);return}
    const o=withO?c[0]:"",[code,name,unit,q]=withO?c.slice(1):c;

    if(!code)return bad.push(tag+"كود الصنف فاضي");
    if(!name)return bad.push(tag+"اسم الصنف فاضي");
    if(!unit)return bad.push(tag+"الوحدة فاضية");

    if(isP(code)&&!["عبوة","جرام"].includes(nu))return bad.push(tag+"الصنف "+code+" وحدته عبوة أو جرام بس");

  });

}

function recalc(o){

  if(noT(o)){ /* طلب عميل: الشحن للعميل من مشعل. خروج أكتوبر/أبو صير = توريد لمشعل مش شحن للعميل */

  else if(any){o.stage="partial";o.holdReason=""}
  else if(rdy){o.stage="ready";o.holdReason=""}

function buildNext(prev,rows){

  else{const op=orders.filter(o=>!isArchived(o,"log"));n("كل الطلبات",orders.length);n("مفتوحة",op.length);n("متأخرة",op.filter(isLate).length,1)}
  return `<div class="dep"><div class="di">${d[0]}</div><div class="dt"><h3>${d[1]}</h3><p>${d[2]}</p></div><div class="dc">${ch.join("")}</div></div>`}catch(e){return ""}}

let typing=false;document.addEventListener("input",()=>typing=true);
function snapVals(){const m={};document.querySelectorAll("#app input[id],#app textarea[id],#app select[id]").forEach(e=>{m[e.id]=e.type==="checkbox"?e.checked:e.value});return m}
function refresh(){
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae.type!=="checkbox"&&ae.closest&&ae.closest("#app"))return;
  const v=snapVals();render();
  Object.keys(v).forEach(id=>{const e=document.getElementById(id);if(!e||e.value===v[id])return;if(e.type==="checkbox")e.checked=v[id];else if(e.value===""||e.defaultValue===e.value)e.value=v[id]});
}

  db.collection("orders").orderBy("createdAt","desc").onSnapshot(s=>{orders=s.docs.map(d=>d.data());checkNew();refresh()},err);
}
